name: publish-distroless-dev

# Develop-lane counterpart of `distroless.yml`. `distroless.yml` publishes the
# STABLE image (`:latest` + version tags) from `v*` tags cut off `main`; this
# workflow publishes the DEVELOP image (`:develop` + an immutable
# `develop-<sha>`) on every push to `develop`, so downstream develop-lane
# consumers can pin the next-dev runtime separately from stable `:latest`.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish-distroless-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/greenticai/greentic-start-distroless
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short

      - name: Build and push develop distroless greentic-start image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.distroless
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
