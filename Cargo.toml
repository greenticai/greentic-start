bench = [
    { name = "perf", harness = false },
]

[package]
name = "greentic-start"
version = "1.1.0-dev.1"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = [
    "greentic",
    "cli",
    "lifecycle",
    "orchestration",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[dependencies]
anyhow = "1.0"
arc-swap = "1"
async-trait = "0.1"
backhand = "0.25"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
notify-debouncer-full = "0.7"
once_cell = "1.21"
open = "5"
rand = "0.10"
rpassword = "7"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sys-locale = "0.3"
sysinfo = "0.39"
sha2 = "0.11"
subtle = "2"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

# Lower bound pinned to the first dev build exposing the `signing` module
# (verify_artifact_dsse / TrustRoot); earlier 1.1.0-dev builds lack it.
[dependencies.greentic-distributor-client]
version = ">=1.1.0-dev.26402898736, <1.2.0-0"
default-features = false
features = [
    "pack-fetch",
]

# Lower bound pinned to the first dev build re-exporting `load_trust_root`
# (per-env trust root + operator key, deployer #226). Floor bumped to the
# D.4 train-2 publish (deployer #243) — `BundleDeployment.config_overrides`
# is read here at egress time, so the deployer + deploy-spec must both
# expose the field.
[dependencies.greentic-deployer]
version = ">=1.1.0-dev.27032942340, <1.2.0-0"
default-features = false

# Matches the deploy-spec the pinned deployer was built against; `Environment`
# / `Revision` cross the deployer boundary, so resolution must not pick an
# older deploy-spec. Floor bumped to the D.4 train-1 publish that adds
# `BundleDeployment.config_overrides` — the egress projects per-pack
# overrides into `SendPayloadInV1.config`; earlier publishes don't carry
# the field and the route table would drop it on load.
[dependencies.greentic-deploy-spec]
version = ">=0.1.27032942340, <0.2"

[dependencies.greentic-setup]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-runner-desktop]
version = ">=1.1.0-dev, <1.2.0-0"

# Floor pinned to the Phase D.2 publish (greentic-runner#397) that exposes
# `RunnerHost::invoke_provider_for_revision` (per-revision provider
# invocation primitive consumed by the `ProviderRoute` admission arm),
# `RunnerHost::identify_messaging_endpoints_for_revision_scoped` (M1 IID
# PR-B2a, the per-provider scoped identify variant consumed by
# `endpoint_resolver`), AND
# `RunnerHost::describe_identify_instances_for_revision` (hint preflight
# consumed by `endpoint_resolver` to strip headers for unhinted providers).
# Earlier publishes still satisfy the unscoped resolver floor (#390) but
# lack one or more of these surfaces.
[dependencies.greentic-runner-host]
version = ">=1.1.0-dev.26895901753, <1.2.0-0"

[dependencies.greentic-secrets-lib]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "providers-dev",
]

[dependencies.greentic-telemetry]
# Floor pinned to the first dev publish that exposes `RolloutEvent` +
# `emit_rollout_event` (C5.1); lower versions in the same range satisfy
# `>=1.1.0-dev` but lack the rollout module.
version = ">=1.1.0-dev.26432434860, <1.2.0-0"

[dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "serde",
]

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.qa-spec]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "signal",
    "sync",
    "net",
    "macros",
]

[dependencies.tokio-stream]
version = "0.1"
features = [
    "sync",
]

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
    "serde",
]

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
