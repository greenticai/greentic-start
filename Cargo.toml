[package]
name = "greentic-start"
version = "0.5.46"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = ["greentic", "cli", "lifecycle", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
greentic-distributor-client = { version = "0.5", default-features = false, features = ["pack-fetch"] }
greentic-llm = { version = "1" }
greentic-runner-desktop = { version = "0.5" }
greentic-runner-host = { version = "0.5" }
greentic-secrets-lib = { version = ">=0.5.2, <0.6.0", features = ["providers-dev"] }
greentic-setup = { version = "0.5" }
greentic-types = { version = "0.5", features = ["serde"] }
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
once_cell = "1.21"
open = "5"
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
qa-spec = { version = ">=0.5.0, <0.6.0" }
rand = "0.10"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
sys-locale = "0.3"
sysinfo = "0.39"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "net"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unic-langid = "0.9"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

[dev-dependencies]
criterion = "0.8"
# Enable greentic-llm's scriptable test double (TestLlmProvider) for unit tests
# only — `test-mock` stays out of release builds.
greentic-llm = { version = "1", features = ["test-mock"] }
tempfile = "3"

[[bench]]
name = "perf"
harness = false

# Local override: build against the in-tree greentic-runner that fixes the
# reverse-DNS component-id truncation (ai.greentic.* -> ai.greentic). Local
# only — not for commit.
[patch.crates-io]
greentic-runner-host = { path = "../greentic-runner/crates/greentic-runner-host" }
greentic-runner-desktop = { path = "../greentic-runner/crates/greentic-runner-desktop" }
runner-core = { path = "../greentic-runner/crates/runner-core" }
