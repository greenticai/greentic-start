bench = [{ name = "perf", harness = false }]

[package]
name = "greentic-start"
version = "1.2.0-dev.0"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = ["greentic", "cli", "lifecycle", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.{archive-format}"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
arc-swap = "1"
# 0.49, not 0.46: every async-nats 0.46.x pins `rustls-webpki = "0.102"`, whose
# newest release (0.102.8) carries GHSA-82j2-j2ch-gfr8 (high) and
# GHSA-pwjx-qhcg-rvj4. No fixed 0.102.x exists; 0.47 moved to the patched 0.103
# line. Must match the version `greentic-runner-host` resolves or the lock keeps
# both webpki copies. Neither advisory is reachable here (both are CRL-parsing
# bugs and async-nats configures no CRLs), but dependency review gates on the
# lock, not on reachability.
async-nats = "0.49"
async-trait = "0.1"
backhand = "0.25"
base64 = "0.22"
chrono = "0.4"
# Flow triggers (greentic.triggers.v1): cron evaluated in the declared IANA
# timezone. `cron` matches the runner's own timer dialect (adapt_timer).
chrono-tz = "0.10"
cron = "0.16"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
# A pre-release RANGE, not a plain `"1"` and no longer an exact pin, and both
# halves of that matter.
#
# Pre-release: cargo excludes pre-releases from a requirement that carries none,
# so `"1"` could never resolve this lane at all — it sat on 1.1.0, and a
# published greentic-start therefore shipped a runner that predates describe-v2.
#
# Range rather than exact: the exact pin existed because runner-host's
# `greentic-llm-backend` feature pulled its own `greentic-llm = "=1.3.1-research.0"`
# (greentic-runner#743), and an `Arc<dyn LlmProvider>` crossing that boundary
# only type-checks when both sides resolve ONE copy. Since greentic-runner#788
# runner-host declares `>=1.2.0-dev, <1.3.0-0` instead, and greentic-dw's
# operala crates declare the same range from the registry — so a single lane
# range here unifies all three, and an exact pin would now be the thing most
# likely to break unification the next time a neighbour publishes. The
# obligation is unchanged and still worth checking after any bump:
# `cargo tree -i greentic-llm` must print ONE instance.
#
# The floor is the publish this tree resolves and was verified against, and it
# carries the two surfaces this graph depends on (checked in the resolved
# source, not inferred): `ProviderKind::requires_api_key()`
# (`capabilities.rs:101`, which runner-host's `agent_node` asks whether an empty
# key is legitimate for the configured provider) and Ollama advertising
# `tools: true` (`capabilities.rs:249` — the matrix is consulted by
# `RigBackend::chat` BEFORE a request is built, so a `false` there does not
# degrade a tool-calling turn, it refuses one).
greentic-llm = { version = ">=1.2.0-dev.35838533452, <1.3.0-0" }
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
# RS256 verification of the MCP OAuth tokens (worker-interop contract §3).
# Already in the tree transitively; declared here because this crate now
# verifies tokens itself.
jsonwebtoken = "10"
libc = "0.2"
notify-debouncer-full = "0.7"
once_cell = "1.21"
open = "5"
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
rand = "0.10"
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager",
    # TLS (`rediss://`) via rustls + bundled Mozilla roots (no system cert
    # store needed, so the distroless musl binary works). Requires a
    # process-default crypto provider — see redis_tls::ensure_crypto_provider_for.
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# MCP SERVER surface (`POST /mcp`, worker-interop contract §3). Pinned
# EXACTLY: the 3.x line shipped five releases in three weeks
# (3.0.1 2026-07-29 → 3.1.4 2026-08-20), so a caret range would move the
# protocol implementation under us between builds. This is the same pin
# greentic-designer's own MCP surface carries; the two speak to the same
# clients and must not drift.
#
# `default-features = false` states the feature set rather than inheriting it.
# `server` pulls `schemars` (tool input schemas), `macros` the `#[tool]`
# attributes, and `transport-streamable-http-server` the
# `http`/`http-body`/`bytes`/`tower-service` stack this crate already has via
# hyper 1. Deliberately NOT `client`, `auth`, or any `reqwest` feature: this is
# a server-only surface, and the token check is this crate's own.
rmcp = { version = "=3.1.4", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
rpassword = "7"
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
# hmac-sha1 webhook verification (greentic.triggers.v1 §6.3.3); same digest
# 0.11 line as sha2, so it composes with `hmac` 0.13.
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
sys-locale = "0.3"
sysinfo = "0.39"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

# Direct dep from the research lineage: the SQL gateway serves an axum Router
# (`greentic_runner_host::sql::routes::router` + `axum::serve`) in runtime.rs.
[dependencies.axum]
version = "0.8"

[dependencies.clap]
version = "4.5"
features = ["derive"]

# The agent runtime's billing surface: `billing::WorkerUsageMeter`, which
# `crate::interop::metering::runtime_meter` builds per unit from the staged
# `metering` block and hands to `TenantRuntime::load_revision_with`
# (greentic-runner#798). runner-host does not re-export the crate. Same exact
# requirement as runner-host's (see the runner-desktop block below for why it
# is exact), so it is ONE crate with the copy runner-host pulls through its
# `agentic-worker` feature. No features: `test-mock` stays dev-only (below).
[dependencies.greentic-aw-runtime]
version = "=1.2.0-dev.0"
default-features = false

# Matches the deploy-spec the pinned deployer was built against; `Environment`
# / `Revision` cross the deployer boundary, so resolution must not pick an
# older deploy-spec. The same types also cross the `greentic-runner-host`
# boundary, so all three must share ONE copy — which is what forces the floor
# and the lane to be the same for deploy-spec, deployer and runner-host.
#
# Surfaces this crate consumes, each of which was once its own floor bump and
# all of which the dev lane has carried for months:
#   `Environment::validate`, `BundleDeployment`, `ExtensionBinding::answers_ref`,
#   `ids::*`, `UpdateAction` / `resolved_action()`,
#   `UpdateChannelConfig::blob_base_url` + `resolved_blob_base_url()`,
#   `EnvironmentHostConfig::new` + `#[non_exhaustive]`,
#   `host_config.default_bundle`, `DefaultBundleReason`,
#   `Environment::resolve_default_bundle`.
#
# The floor is the RUNID this tree RESOLVES and was compiled and tested against,
# not the publish any one of those APIs first appeared in — the dev lane stamps
# `1.2.0-dev.<run id>` on every develop push, so a run id is a position in that
# sequence rather than an API marker, and claiming otherwise would be a comment
# nothing checks. What the floor buys is that a fresh resolve cannot pick a
# publish OLDER than this one. A bare `>=1.2.0-dev` means `>=1.2.0-dev.0`, i.e.
# the whole lane back to its first publish, which is what this said before
# greentic-start#625 and is what CLAUDE.md's `>=M.m.p-dev.RUNID` rule exists to
# stop.
[dependencies.greentic-deploy-spec]
version = ">=1.2.0-dev.35969201904, <1.3.0-0"

# Surfaces this crate consumes across the deployer boundary, each once its own
# floor bump: `load_trust_root` (per-env trust root + operator key, #226),
# `EnvironmentHostConfig.public_base_url` and the 2-arg
# `ensure_local_environment` (#250 — `configured_public_base_url_from_env_store`
# and the bootstrap call site), `cli::bundle_stage::materialize_revision_from_bundle`
# (#337 — `revision_pull` stages a worker's pulled bundle at boot),
# `StagedPlan::verify_binary_on_disk` + the staging binary CAS, and
# `plan::plan_targets_env` (the fleet broadcast env id `_`, which
# `revision_serve::check_plan_identity` calls instead of the local copy it
# carried while the dev lane lacked the export).
#
# The floor is `35969201904` (greentic-deployer#613, `bf7b66e3`) because
# `materialize_revision_from_bundle` runs `pack_config_stage` at BOOT: before
# #613 it refused an Agentic Worker's `state/pack-configs/pack.dw.<slug>.json`
# ("pack_id `pack.dw.<slug>` is not in the bundle's pack-list.lock", the wizard
# locks it as `pack-dw-<slug>`). The designer's CLI deployer already carried
# #613, so `op env up` staged the revision and the container then died before
# binding its port -- a Cloud Run readiness timeout for every worker with any
# setup answer (designer.demo, 2026-09-24).
#
# The RUNID is the publish this tree resolves and was verified against — see the
# deploy-spec block above for why a dev-lane run id is a position in a sequence
# and not an API marker, and why `>=1.2.0-dev` (i.e. `.0`) is not a floor at all.
# deployer and deploy-spec publish together, so the two run ids match.
[dependencies.greentic-deployer]
version = ">=1.2.0-dev.35969201904, <1.3.0-0"
default-features = false

# Surfaces this crate consumes: the `signing` module (`verify_artifact_dsse` /
# `TrustRoot`) and `DefaultRegistryClient::with_insecure_registries`
# (distributor-client#168 — `bundle_ref::fetch_remote_bundle` calls it when
# GREENTIC_OCI_INSECURE_REGISTRIES is set, so listed registries are pulled over
# plain HTTP). Both have been on the dev lane for months.
#
# The RUNID is the publish this tree resolves and was verified against; see the
# deploy-spec block for why that, and not an API-first-appearance number.
[dependencies.greentic-distributor-client]
version = ">=1.2.0-dev.35757697239, <1.3.0-0"
default-features = false
features = ["pack-fetch"]

# `=1.2.0-dev.0` is NOT a floor and not a version anyone published: it is the
# workspace version of the greentic-runner revision the `[patch.crates-io]`
# section at the foot of this file names, and an exact requirement is what makes
# cargo take the patch. With a lane RANGE here the registry's higher
# `1.2.0-dev.<run id>` publishes win and the patch is silently unused — the
# failure mode the patch block's own comment describes. Move this the day that
# revision is published, not before.
#
# The surface that forced the revision on this crate: `RunOptions::entry_node`
# (greentic-runner#698), which the demo messaging host uses to name a flow node
# as the flow's entry node.
[dependencies.greentic-runner-desktop]
version = "=1.2.0-dev.0"

# `=1.2.0-dev.0` is an exact PATCH pin, not a floor — see the runner-desktop
# block above for why a lane range here would silently discard the patch.
#
# The surfaces that accumulated as floor bumps while this WAS a floor, all of
# them long since on the revision below, kept because each names a real failure
# an older resolve produces:
#   * #466 — `HostNode::from` no longer splits a resolved component symbol on
#     its last dot when the operation is carried structurally; earlier publishes
#     mis-resolve any dotted component id (`ai.greentic.component-templates` →
#     `ai.greentic`) and fail with "component '…' not found in pack". Supersedes
#     the C5 `runtime_refs` floor (#424).
#   * #599 — the first dev publish built against deploy-spec 0.2. runner-host's
#     ids cross into revision_pull / doctor_env alongside the deployer's, so an
#     earlier publish drags a second deploy-spec copy in (E0308).
#   * #698 — `FlowEngine::execute_from`, the ported `var.set` and card `answers`
#     node families, and the one-shot routing action; without them a designer
#     card journey loses every captured field.
#   * #700/#701 — re-enables `agentic-worker`, which is what makes an MCP flow
#     node actually dispatch (before it `execute_mcp` was a stub returning Ok
#     with an `{error: …}` payload, so an MCP node reported success while doing
#     nothing), and grows `HostConfig` with `agents`/`graphs`.
#   * #792 — `storage::{StorageConfig, SessionBackend, StateBackend}` and
#     `HostBuilder::with_storage`, which `crate::durable_state` is built on.
[dependencies.greentic-runner-host]
version = "=1.2.0-dev.0"
# `greentic-llm-backend` routes every in-process `dw.agent` LLM call through
# greentic-llm's multi-provider backend. Without it runner-host compiles the
# OpenAI-only client (`agent_node.rs`, "built WITHOUT the greentic-llm-backend
# feature"): the agent's configured `llm.provider` is ignored, Ollama cannot call
# tools, and a keyless provider still needs a key. greentic-runner's own release
# binary has always been built with it; the operator environment, k8s and
# Cloud Run all serve through THIS binary instead, so they never had it.
#
# `desktop-agent-ephemeral` is deliberately NOT enabled. runner-host documents it
# as "must NOT be enabled in the server binary": it switches on greentic-aw-runtime's
# `test-mock` (a mock token meter) and `dev-allow-unsigned`, and this binary is
# also the greentic-start-distroless image pods run. That does not make Redis a
# prerequisite: with `GREENTIC_AW_REDIS_URL` unset, runner-host's
# `aw_backends::select_state_backend` falls back to an in-memory agent state
# store in every build (greentic-runner, 2026-07-08; corrected in its docs by
# #786). So `dw.agent` and deep-worker tools run without Redis; set it only for
# conversation memory and budgets that survive restarts and span replicas.
#
# `operala-in-process` (greentic-runner #774) wires the in-process deep-worker
# handler for `operala.call` nodes (`greentic-dw-operala-invoker` running
# `DeepLoopCoordinator` over a `greentic_llm::RigBackend`), so a deployed Deep
# worker runs without a NATS remote dispatcher. Unlike `desktop-agent-ephemeral`
# it does NOT imply greentic-aw-runtime's `test-mock` (or `dev-allow-unsigned`):
# runner-host declares it server-safe, pulling only `agentic-worker`, the two
# operala crates and `greentic-llm`. The handler is wired only when an LLM key
# resolves, by the same policy `dw.agent`'s in-process backend uses:
# `GREENTIC_LLM_API_KEY` / `OPENAI_API_KEY` first, else the first agent's
# `llm.credential_ref` from the tenant secrets store. With no key, `operala.call`
# falls back to NATS (and fails without it). `GREENTIC_OPERALA_DISPATCH=nats`
# forces the NATS `RemoteDispatchHandler` path. The operala crates used to pin
# greentic-llm from GIT, which needed a `[patch."…/greentic-llm"]` section here
# to keep the graph on one copy; since the dev-lane move they declare the
# registry range instead, so that patch is gone and unification is plain
# resolution. `cargo tree -i greentic-llm` is still the check.
#
# `session-redis` is named EXPLICITLY even though it is in runner-host's default
# feature set. Without it a Redis session backend is a hard build-time refusal
# (`storage::session::store_from_config`'s `#[cfg(not(feature = ...))]` arm), so
# the day that default changes upstream, an operator's
# `GREENTIC_RUNNER_SESSION_BACKEND=redis` stops booting — which is the right
# failure, and a failure we would rather not discover from a deployment. Naming
# it here makes this binary's need for durable conversation state a declared
# fact rather than an inherited one. See `crate::durable_state`.
features = ["greentic-llm-backend", "operala-in-process", "session-redis"]

[dependencies.greentic-secrets-lib]
# `providers-vault` brings in the HashiCorp Vault KV backend used for runtime
# secret resolution under pod workload identity (Phase E). The Kubernetes-auth
# token exchange it relies on landed in greentic-secrets#94; a publish without
# it resolves a vault provider that only supports a static VAULT_TOKEN, not the
# pod-identity login. The whole 1.2.0-dev lane carries it — the `1.1.0-dev`
# number this comment used to name as "the floor below" stopped being the floor
# when the crate moved lanes, and naming it here after the move was a comment
# describing a requirement that was not in the file.
#
# The RUNID is the publish this tree resolves and was verified against; see the
# deploy-spec block. `greentic-secrets-spec` rides the same publish.
version = ">=1.2.0-dev.35756158093, <1.3.0-0"
features = ["providers-dev", "providers-vault"]

# Consumes the bootstrap call site updated for the deployer's 2-arg
# `ensure_local_environment` (greentic-setup#134); a publish with the 1-arg call
# does not compile against the deployer floor above.
#
# The RUNID is the publish this tree resolves and was verified against — and for
# this crate it is also the NEWEST 1.2.0-dev publish, which is worth noticing:
# greentic-setup's dev lane sits ~1.7M run ids behind its neighbours', so it is
# the one crate in this file whose registry copy is meaningfully older than the
# git revision it was pinned at before greentic-start#625. If something in the
# setup/onboarding surface regresses, look here first.
[dependencies.greentic-setup]
version = ">=1.2.0-dev.34019087428, <1.3.0-0"

[dependencies.greentic-telemetry]
# Consumes `RolloutEvent` + `emit_rollout_event` (C5.1) and `TelemetryCtx::kv()`
# carrying `gt.pack_id` (which runner-host's C5.4 export path needs, and which
# every 1.2 dev publish has).
#
# The RUNID is the publish this tree resolves and was verified against; see the
# deploy-spec block. Note this crate's dev lane is much older than its
# neighbours' — 28923800659 is the NEWEST 1.2.0-dev publish, not a held-back
# floor — so the run ids here are not comparable across crates.
version = ">=1.2.0-dev.28923800659, <1.3.0-0"

[dependencies.greentic-types]
# `EnvId`, `TenantCtx`, `ReplyScope`, `GreenticError` and friends cross the
# runner-host, deployer and secrets boundaries, so this must resolve to the one
# copy every neighbour resolved. The RUNID is the publish this tree resolves and
# was verified against; see the deploy-spec block for why a bare `>=1.2.0-dev`
# is `>=1.2.0-dev.0` and therefore not a floor.
version = ">=1.2.0-dev.35752963135, <1.3.0-0"
features = ["serde"]

# Update-serving surface (revision_serve.rs): `binswap` carries the archive-unpack
# + atomic-swap primitive behind the stage-only binary self-update path
# (`select_binary`); `stream` carries the SSE client the push path uses
# (`stream::{build_stream_client, run_stream}`). Tracks greentic-update's dev
# line — the `0.1.x` cross-lane conflict that once blocked this (distributor-client
# 1.2) is gone now that greentic-update publishes `1.2.0-dev.N` on the same lane.
#
# The RUNID is the publish this tree resolves and was verified against; see the
# deploy-spec block.
[dependencies.greentic-update]
version = ">=1.2.0-dev.35759228855, <1.3.0-0"
features = ["binswap", "stream"]

[dependencies.hyper]
version = "1"
features = ["full"]

[dependencies.qa-spec]
# The QA form specifications `onboard/` serves and `component_qa_ops` validates
# against. It crosses the greentic-setup boundary, so it has to be the copy
# setup resolved. The RUNID is the publish this tree resolves and was verified
# against; see the deploy-spec block.
version = ">=1.2.0-dev.35754484282, <1.3.0-0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "signal", "sync", "net", "macros"]

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.ureq]
version = "3"
features = ["json"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dev-dependencies]
criterion = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# The agent runtime this binary is built against, with its test doubles, so
# agent_provenance's contract test drives the REAL `AgentRuntime::step` rather
# than a hand-written trail. Dev-only: `test-mock` never reaches a release
# build (edition-2024 resolver keeps dev-dependency features out of it). Same
# version runner-host pins, resolved from the same git revision via the patch
# below, so it is ONE crate with runner-host's, not a second copy.
greentic-aw-runtime = { version = "=1.2.0-dev.0", features = ["test-mock"] }
# For `ExtensionRuntime::for_test()`. It must be the same SOURCE and a
# compatible requirement to whatever greentic-aw-runtime declares, or the graph
# holds two copies and the `ExtensionRuntime` handed across the boundary does
# not type-check. It used to be a git rev because aw-runtime's was; since the
# dev-lane move aw-runtime declares `greentic-ext-runtime = ">=1.2.0, <1.3.0"`
# from the registry, so this is byte-identical to it rather than "exact".
#
# No RUNID floor: this crate does NOT publish on the `1.2.0-dev.<run id>` lane —
# it publishes plain `1.2.<run id>` releases — so the CLAUDE.md dev-lane floor
# rule does not apply and copying aw-runtime's requirement verbatim is what
# keeps the two in step.
greentic-ext-runtime = ">=1.2.0, <1.3.0"
# Enable greentic-llm's scriptable test double (TestLlmProvider) for unit tests
# only — `test-mock` stays out of release builds.
# Must stay byte-identical to the [dependencies] pin above (see its comment):
# a differing requirement here resolves a second greentic-llm for test builds.
greentic-llm = { version = ">=1.2.0-dev.35838533452, <1.3.0-0", features = ["test-mock"] }
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
wat = "1"

# THE LANE: `1.2.0-dev`. greentic-runner#788 moved the runner workspace off the
# 1.3.0-research line and back onto the single `1.2.0-dev` crates.io lane that
# `dev-publish.yml` stamps on every develop push, and deleted the runner's own
# `[patch.crates-io]` section outright. greentic-runner-host now requires
# `greentic-deploy-spec`, `greentic-flow`, `greentic-secrets-lib`,
# `greentic-session`, `greentic-state` and `greentic-llm` as
# `>=1.2.0-dev, <1.3.0-0`; this binary crosses every one of those types with the
# runner, so its own requirements had to move with it or the graph resolves two
# copies of each and the hand-offs stop type-checking (E0308).
#
# That is the unwind the previous comment here asked for: the research-line
# numbers (`greentic-deploy-spec 1.3.0-research.3`, `greentic-setup
# 1.3.1-research.0`, …) never existed on crates.io — they were develop's code
# under never-published numbers, resolved by commit while the fleet-wide
# publishing lock ran (2026-09-08 to 2026-09-22). The lock is lifted and the
# dev lane is current, so every one of those crates now resolves from the
# registry and the patches for them are gone.
#
# What is left is ONE patch, for the three greentic-runner crates, because the
# revision this binary needs is not published yet: b07fa100 is the develop merge
# of greentic-runner#802, which makes our own A2A CLIENT read a completed task's
# STRUCTURED artifacts and not only its prose. #639 made this binary ANSWER a
# turn that produced `result.structured_content` with a Task whose artifacts
# carry it (worker-interop contract D13); #802 is the other half, on the calling
# side. Without it `a2a_source::task_reply` reads
# `task.artifacts[].parts[].text` only, so a deployed worker calling another
# Greentic worker receives the sentence and never the object the callee
# deliberately produced — the call succeeds, the model answers from the prose
# alone, and the missing result is indistinguishable from the callee not having
# produced one. Nothing is red at any layer. Tracked as #642.
#
# Two rules #802 states at its own call site, because each is silent if
# changed: the media type is matched EXACTLY (`application/json`), never by a
# `+json` suffix, so an Adaptive Card
# (`application/vnd.microsoft.card.adaptive+json`) cannot reach a model that
# never asked for one (contract D10); and a task carrying a structured part and
# no prose is ANSWERED rather than reported as having said nothing.
#
# It is the direct child of 5a1b3684, the develop merge
# of greentic-runner#801 (`run_outcome::HttpRunOutcomeSink` +
# `RevisionHostOptions::with_run_outcome_sink` — one run outcome per flow turn,
# the deployed run audit; `interop::metering::run_outcome` installs it). It is
# the direct child of b1f82a18, the develop merge
# of greentic-runner#800 (`component == "a2a"` — the flow node that lets a plain
# FLOW, not only an agentic worker, call an external agent). Without it `a2a` is
# absent from `NATIVE_OP_KEYS`, so a deployed flow carrying that node has it
# silently wrapped as an undispatchable component. It descends from 79e516b5,
# the develop merge of greentic-runner#798 (`TenantRuntime::load_revision_with`,
# `RevisionHostOptions::with_billing_meter`, `billing::WorkerUsageMeter` — the
# per-unit worker-usage meter), and from f6ff5590, the develop merge
# of greentic-runner#792, which makes runner-host's session and flow-state
# stores configurable (`storage::StorageConfig` + `HostBuilder::with_storage`)
# — the surface `durable_state::resolve_storage_config` depends on. Its
# workspace version is `1.2.0-dev.0`, which satisfies the dev-lane requirements
# above, so the patch applies rather than being silently ignored.
#
# HAZARD, recorded rather than fixed: `<1.3.0-0` does NOT exclude the
# `1.2.0-research.N` line. Pre-release identifiers compare as strings, `"dev"`
# sorts BELOW `"research"`, so every range in this file — floor or not — prefers
# a `1.2.0-research.N` publish over any `1.2.0-dev.<run id>`. A RUNID floor does
# not help: research still sorts above it. Nothing resolves one today only
# because every such publish is YANKED, verified against the sparse index on
# 2026-09-23 for distributor-client (.0–.2), types (bare + .1–.3), qa-spec
# (.0–.1), secrets-lib/-spec (.0–.1), llm (bare), setup (.0), flow (.0–.1),
# pack-lib (.0–.4), session (.0–.1) and state (.0–.1); deployer, deploy-spec,
# telemetry and update have none at all.
#
# So this rests on a yank, not on a requirement, and a yank can be reversed.
# Excluding the line properly needs an upper bound below it (`<1.2.0-e`, or
# `<1.2.0-research`), which would also exclude the stable `1.2.0` this lane is
# meant to graduate to, and would put this repo out of step with the identical
# ranges every neighbour declares. If the research line is ever un-yanked or
# revived, revisit every range in this file BEFORE the next resolve — do not
# assume the committed lock protects you, since a lock is only consulted with
# `--locked`.
#
# A patch section does not travel into a published crate, so this does not
# change what a crates.io consumer resolves.
#
# TO UNWIND: once a dev-lane publish carries #802 (and so #801, #800, #798,
# #792), delete this block and run `cargo update`.
[patch.crates-io]
greentic-runner-host = { git = "https://github.com/greenticai/greentic-runner", rev = "b07fa100a9ffd04ef13ed49f4ee88de03fa038e9" }
greentic-runner-desktop = { git = "https://github.com/greenticai/greentic-runner", rev = "b07fa100a9ffd04ef13ed49f4ee88de03fa038e9" }
greentic-aw-runtime = { git = "https://github.com/greenticai/greentic-runner", rev = "b07fa100a9ffd04ef13ed49f4ee88de03fa038e9" }
