bench = [{ name = "perf", harness = false }]

[package]
name = "greentic-start"
version = "1.3.0-research.0"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"

# cargo-binstall pulls the pre-built binary from the GitHub release tagged
# `v{version}`. The research-branch binary is built from git deps (full runner
# with agentic-worker + greentic-llm-backend), so it carries multi-provider
# dw.agent — unlike any crates.io-source build (aw-runtime is publish=false).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
keywords = ["greentic", "cli", "lifecycle", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
async-nats = "0.46"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
# main-lane features carried into the AW (research) dependency world:
#   greentic-llm        -> src/llm + src/fast2flow/llm_router
#   opentelemetry stack -> src/metrics + src/otlp_telemetry
#   reqwest             -> src/lib.rs + src/runner_host/dispatch.rs
#   tracing-*           -> src/otlp_telemetry + src/lib.rs
greentic-llm = { version = "=1.3.0-research.0" }
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
once_cell = "1.21"
open = "5"
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
rand = "0.10"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.11"
sys-locale = "0.3"
sysinfo = "0.39"
tar = "0.4"
thiserror = "2"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

[dependencies.axum]
version = "0.8"

[dependencies.clap]
version = "4.5"
features = ["derive"]

[dependencies.greentic-aw-runtime]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "0baa65355013a154d0a34b7fafb1ae6389ff0fb6"
default-features = false

[dependencies.greentic-distributor-client]
version = "=1.3.0-research.1"
default-features = false
features = ["pack-fetch"]

# Pinned to runner rev 9412530a (greentic-runner#587): exposes prior node
# outputs to routing conditions, so `node.<id>.field` in a .ygtc route
# condition resolves under `gtc start`. Before this rev, build_routing_context
# carried only entry/in/response/event — a `node.*` route condition rendered
# "" and took the wrong branch silently. Descends from the previous pin
# 1df54513 (121 commits), so it keeps the multi-provider in-process LLM backend
# for dw.agent (via greentic-llm, the opt-in `greentic-llm-backend` feature
# below), the greentic-ext-runtime OAuth-broker host import, and the
# process-global desktop ephemeral AW state store. Requires greentic-setup,
# greentic-types, secrets-lib, distributor-client + qa-spec all on the
# 1.3.0-research.1 line (bumped together below; see greenticai/greentic-setup#216).
[dependencies.greentic-runner-desktop]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "0baa65355013a154d0a34b7fafb1ae6389ff0fb6"
default-features = false
features = ["agentic-worker", "greentic-llm-backend", "desktop-agent-ephemeral"]

[dependencies.greentic-runner-host]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "0baa65355013a154d0a34b7fafb1ae6389ff0fb6"
default-features = false
features = ["agentic-worker", "greentic-llm-backend"]

[dependencies.greentic-secrets-lib]
version = "=1.3.0-research.1"
features = ["providers-dev"]

# Consumed as a git dep on the research branch (like greentic-runner) so it
# tracks the types 1.2.0-research migration directly, independent of the -dev
# crates.io publish-stamp version. greentic-setup's deps are on the research
# line; its own crate version follows its -dev publish channel.
[dependencies.greentic-setup]
git = "https://github.com/greenticai/greentic-setup.git"
branch = "research"

# Exact-pinned to the research-content build (carries ComponentDescribe.outcomes,
# PackManifest.agents, and runtime_dispatch types the runner rev needs). A loose
# `>=1.1.0-dev, <1.2.0-0` would resolve to a higher-numbered develop/main build
# that LACKS those, breaking the runner graph; consuming the published research
# build directly avoids the old git [patch] that force-unified greentic-types and
# broke greentic-setup. Bump this when a newer research build is published.
[dependencies.greentic-types]
version = "=1.3.0-research.1"
features = ["serde"]

[dependencies.hyper]
version = "1"
features = ["full"]

[dependencies.qa-spec]
version = "=1.3.0-research.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "signal", "sync", "net", "macros"]

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.ureq]
version = "3"
features = ["json"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dev-dependencies]
criterion = "0.8"
# Enable greentic-llm's scriptable test double (TestLlmProvider) for unit tests
# only — `test-mock` stays out of release builds.
greentic-llm = { version = "=1.3.0-research.0", features = ["test-mock"] }
tempfile = "3"

# greentic-runner (rev 9412530a) pulls greentic-extension-sdk-contract
# =1.3.0-research.1 and greentic-mcp-exec (list_tools), both git-tag/branch-only
# (not republished to crates.io). Cargo [patch] does NOT propagate through git
# dependencies, so greentic-start must declare the same redirects to resolve the
# agentic-worker graph. NOTE: unlike the runner, we do NOT patch greentic-types
# here (we pin the published research build above) — a git patch would unify
# greentic-types graph-wide and break greentic-setup's 0.5 line.
[patch."https://github.com/greenticai/greentic-llm"]
# greentic-dw's provider crates (operala-invoker et al.) pin greentic-llm via a
# git tag (v1.2.6-research); this workspace and the runner use the crates.io
# release (=1.3.0-research.0). Two sources -> two `LlmProvider` traits ->
# DeepWorkerInvoker::new type-mismatch (E0308). The runner unifies them with this
# exact patch in ITS root, but a Cargo [patch] does NOT propagate through a git
# dependency, so greentic-start must mirror it. Verify with
# `cargo tree -i greentic-llm` (must show a single version). Drop once
# greentic-dw consumes the crates.io release directly.
greentic-llm = { version = "=1.3.0-research.0" }

[patch.crates-io]
greentic-extension-sdk-contract = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.1" }
greentic-mcp-exec = { git = "https://github.com/greenticai/greentic-mcp.git", rev = "1f353b4b494354e8923ed40409970f3eb865f69a" }

# NOTE: greentic-ext-runtime is NOT patched here. The runner rev pinned above
# (9412530a) already pins greentic-ext-runtime to rev 82d1bb24, which carries the
# `greentic:oauth-broker/broker-v1` host import + `oauthProviders` describe field
# so OAuth-enabled design extensions (e.g. greentic.hubspot) load AND instantiate
# and the extension's tools reach the agent. Bumping the runner rev is the
# coordinated, in-graph fix; a local ext-runtime [patch] cannot satisfy the
# graph's exact sdk-contract pins.

