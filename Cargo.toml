bench = [
    { name = "perf", harness = false },
]

[package]
name = "greentic-start"
version = "1.1.0-dev.1"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = [
    "greentic",
    "cli",
    "lifecycle",
    "orchestration",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[dependencies]
anyhow = "1.0"
arc-swap = "1"
async-trait = "0.1"
backhand = "0.25"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
greentic-llm = { version = "1" }
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
notify-debouncer-full = "0.7"
once_cell = "1.21"
open = "5"
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
rand = "0.10"
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager",
    # TLS (`rediss://`) via rustls + bundled Mozilla roots (no system cert
    # store needed, so the distroless musl binary works). Requires a
    # process-default crypto provider — see redis_tls::ensure_crypto_provider_for.
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sys-locale = "0.3"
sysinfo = "0.39"
sha2 = "0.11"
subtle = "2"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

# Lower bound pinned to the first dev build exposing the `signing` module
# (verify_artifact_dsse / TrustRoot); earlier 1.1.0-dev builds lack it. Floor
# bumped to the publish that adds
# `DefaultRegistryClient::with_insecure_registries` (distributor-client#168) —
# `bundle_ref::fetch_remote_bundle` calls it when
# GREENTIC_OCI_INSECURE_REGISTRIES is set so listed registries are pulled over
# plain HTTP; earlier publishes lack that constructor.
[dependencies.greentic-distributor-client]
version = ">=1.1.0-dev.27832309681, <1.2.0-0"
default-features = false
features = [
    "pack-fetch",
]

# Lower bound pinned to the first dev build re-exporting `load_trust_root`
# (per-env trust root + operator key, deployer #226). Floor bumped to the
# Change-C-part-1 publish (deployer #250) — `EnvironmentHostConfig.public_base_url`
# is consumed here in `configured_public_base_url_from_env_store` and the
# `ensure_local_environment` call now passes the 2-arg signature; earlier
# publishes lack both surfaces. Floor bumped again to the M2 PR2a publish
# (deployer#337) — `revision_pull` calls
# `cli::bundle_stage::materialize_revision_from_bundle` to stage a worker's
# pulled bundle at boot; earlier publishes lack that function.
[dependencies.greentic-deployer]
version = ">=1.1.0-dev.27745539530, <1.2.0-0"
default-features = false

# Matches the deploy-spec the pinned deployer was built against; `Environment`
# / `Revision` cross the deployer boundary, so resolution must not pick an
# older deploy-spec. Floor bumped to the publish that adds
# `EnvironmentHostConfig.gui_enabled` + `resolved_gui_enabled()` (deployer#322);
# greentic-start reads the resolver at boot to gate the built-in webchat
# console, and earlier publishes lack both the field and the method. Floor
# bumped again to the M2 PR1 publish (deployer#335) — `revision_pull` reads
# `Revision.bundle_source_uri` at boot to decide which bundles to pull, and
# earlier publishes lack that field.
[dependencies.greentic-deploy-spec]
version = ">=0.1.27745539530, <0.2"

# Lower bound pinned to the publish that updates the bootstrap call site for
# the deployer's 2-arg `ensure_local_environment` (greentic-setup#134).
# Earlier publishes have the 1-arg call against the new deployer floor and
# would fail to compile in the resolved graph.
[dependencies.greentic-setup]
version = ">=1.1.0-dev.27093775683, <1.2.0-0"

[dependencies.greentic-runner-desktop]
version = ">=1.1.0-dev, <1.2.0-0"

# Floor pinned to the greentic-runner#466 publish that fixes flow-node
# component-id resolution: `HostNode::from` no longer splits a resolved
# component symbol on its last dot when the operation is carried structurally
# (in `component.operation` or the input mapping), and `invoke_component`
# falls back to the legacy `<comp>.<op>` form only when the stripped suffix is
# the operation. Earlier publishes mis-resolve any dotted component id (e.g.
# `ai.greentic.component-templates` → `ai.greentic`) and fail flow execution
# with "component '…' not found in pack". This floor supersedes (and still
# satisfies) the C5 `runtime_refs` floor (#424).
[dependencies.greentic-runner-host]
version = ">=1.1.0-dev.27823510319, <1.2.0-0"

[dependencies.greentic-secrets-lib]
# `providers-vault` brings in the HashiCorp Vault KV backend used for runtime
# secret resolution under pod workload identity (Phase E). The Kubernetes-auth
# token exchange it relies on landed in greentic-secrets#94, first published in
# 1.1.0-dev.28218485692 (the floor below) — older publishes resolve a vault
# provider that only supports a static VAULT_TOKEN, not the pod-identity login.
version = ">=1.1.0-dev.28218485692, <1.2.0-0"
features = [
    "providers-dev",
    "providers-vault",
]

[dependencies.greentic-telemetry]
# Floor pinned to the first dev publish that exposes `RolloutEvent` +
# `emit_rollout_event` (C5.1); lower versions in the same range satisfy
# `>=1.1.0-dev` but lack the rollout module.
version = ">=1.1.0-dev.26432434860, <1.2.0-0"

[dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "serde",
]

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.qa-spec]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "signal",
    "sync",
    "net",
    "macros",
]

[dependencies.tokio-stream]
version = "0.1"
features = [
    "sync",
]

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
    "serde",
]

[dev-dependencies]
criterion = "0.8"
# Enable greentic-llm's scriptable test double (TestLlmProvider) for unit tests
# only — `test-mock` stays out of release builds.
greentic-llm = { version = "1", features = ["test-mock"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
