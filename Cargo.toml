bench = [{ name = "perf", harness = false }]

[package]
name = "greentic-start"
version = "1.2.0-dev.0"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = ["greentic", "cli", "lifecycle", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/{name}-v{version}-{target}.{archive-format}"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
arc-swap = "1"
# 0.49, not 0.46: every async-nats 0.46.x pins `rustls-webpki = "0.102"`, whose
# newest release (0.102.8) carries GHSA-82j2-j2ch-gfr8 (high) and
# GHSA-pwjx-qhcg-rvj4. No fixed 0.102.x exists; 0.47 moved to the patched 0.103
# line. Must match the version `greentic-runner-host` resolves or the lock keeps
# both webpki copies. Neither advisory is reachable here (both are CRL-parsing
# bugs and async-nats configures no CRLs), but dependency review gates on the
# lock, not on reachability.
async-nats = "0.49"
async-trait = "0.1"
backhand = "0.25"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
# Exact pin, not a `"1"` range, and deliberately a pre-release. Cargo excludes
# pre-releases from a requirement that carries none, so `"1"` could never
# resolve the `-research` line at all — it sat on 1.1.0, and a published
# greentic-start therefore shipped a runner that predates describe-v2. This is
# the version `greentic-aw-runtime 1.2.0-dev.34079091767` (reached through
# `greentic-runner-host`) pins; resolving anything else puts two greentic-llm
# copies in the graph. Exact rather than floored for the same reason: the two
# must agree on ONE version.
#
# 1.3.1-research.0 since runner-host's `greentic-llm-backend` feature is enabled
# below: that feature pulls runner-host's own optional `greentic-llm =
# "=1.3.1-research.0"` (greentic-runner#743), so this pin has to be the same
# exact version or the graph cannot resolve. It is also the release in which
# Ollama advertises tool calling.
greentic-llm = { version = "=1.3.1-research.0" }
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
notify-debouncer-full = "0.7"
once_cell = "1.21"
open = "5"
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
rand = "0.10"
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager",
    # TLS (`rediss://`) via rustls + bundled Mozilla roots (no system cert
    # store needed, so the distroless musl binary works). Requires a
    # process-default crypto provider — see redis_tls::ensure_crypto_provider_for.
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.11"
subtle = "2"
sys-locale = "0.3"
sysinfo = "0.39"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

# Direct dep from the research lineage: the SQL gateway serves an axum Router
# (`greentic_runner_host::sql::routes::router` + `axum::serve`) in runtime.rs.
[dependencies.axum]
version = "0.8"

[dependencies.clap]
version = "4.5"
features = ["derive"]

# Matches the deploy-spec the pinned deployer was built against; `Environment`
# / `Revision` cross the deployer boundary, so resolution must not pick an
# older deploy-spec. The same types also cross the `greentic-runner-host`
# boundary, so all three must share ONE copy.
#
# Moved 0.1 -> 0.2 to restore that invariant. It had drifted to
# ">=0.1.27745539530, <0.2" while `greentic-deployer >=1.2.0-dev` below is built
# against deploy-spec 0.2; deploy-spec is 0.x, so cargo treats 0.1/0.2 as
# incompatible, kept both copies, and the ids stopped unifying — E0308 in
# src/doctor_env.rs and src/revision_pull.rs, which is what held the nightly lock
# PR red. main has been on 0.2 throughout; the 07-15 forward-port merge resolved
# this line to develop's stale 0.1 side. Every surface this crate uses
# (`Environment::validate`, `BundleDeployment`, `ExtensionBinding::answers_ref`,
# `ids::*`) is present unchanged on the 0.2 line.
#
# Floor 0.2.3 rather than 0.2.0 is defensive: deployer consumes `UpdateAction` /
# `resolved_action()` (deploy-spec 0.2.2) while declaring only `"0.2"`, so a
# `>=0.2.0` floor here lets a resolve pick 0.2.0 and the *deployer* fails to
# build (greenticai/greentic-deployer#444). Matches the floor main already runs.
# The dev lane publishes 0.2.<runid>, which this range admits — do not rewrite it
# into a ">=1.2.0-dev"-style lane range.
#
# Floor bumped from 0.2.3 to the airgap-C1 publish (deployer #531): the blob-mirror
# fallback in `revision_serve.rs` consumes `UpdateChannelConfig::blob_base_url` and
# `resolved_blob_base_url()`, which first exist in 0.2.30514305131. A >=0.2.3 floor
# still RESOLVES today only because Cargo.lock happens to hold a newer publish — a
# fresh resolve, or `--precise 0.2.3`, would pick a deploy-spec without the field
# and fail to compile. Note for a forward-port to main: this is a dev-lane runid
# floor and stable 0.2.x releases sort BELOW it, so main must instead floor at
# whichever stable release carries `blob_base_url`, not at this value.
#
# Floor bumped again to 0.2.30561430155 — the forward-port publish
# (greentic-deployer#535) that first carries `EnvironmentHostConfig::new` +
# `#[non_exhaustive]`, `host_config.default_bundle`, `DefaultBundleReason` and
# `Environment::resolve_default_bundle`. `webchat_routing.rs` and every
# `EnvironmentHostConfig` construction site in this crate consume them; the
# previous floor admits publishes with none of them.
[dependencies.greentic-deploy-spec]
version = ">=0.2.30561430155, <0.3"

# Lower bound pinned to the first dev build re-exporting `load_trust_root`
# (per-env trust root + operator key, deployer #226). Floor bumped to the
# Change-C-part-1 publish (deployer #250) — `EnvironmentHostConfig.public_base_url`
# is consumed here in `configured_public_base_url_from_env_store` and the
# `ensure_local_environment` call now passes the 2-arg signature; earlier
# publishes lack both surfaces. Floor bumped again to the M2 PR2a publish
# (deployer#337) — `revision_pull` calls
# `cli::bundle_stage::materialize_revision_from_bundle` to stage a worker's
# pulled bundle at boot; earlier publishes lack that function.
[dependencies.greentic-deployer]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
# Floor bumped to 1.2.0-dev.30347759036: first publish carrying
# StagedPlan::verify_binary_on_disk + the staging binary CAS (B3 in-band
# binary consumption). Floor bumped again to 1.2.0-dev.30553549034 — the
# forward-port publish that exports `plan::plan_targets_env` (fleet broadcast
# env id `_`); `revision_serve::check_plan_identity` calls it instead of the
# local copy it carried while the dev lane lacked the export.

# Lower bound pinned to the first dev build exposing the `signing` module
# (verify_artifact_dsse / TrustRoot); earlier 1.1.0-dev builds lack it. Floor
# bumped to the publish that adds
# `DefaultRegistryClient::with_insecure_registries` (distributor-client#168) —
# `bundle_ref::fetch_remote_bundle` calls it when
# GREENTIC_OCI_INSECURE_REGISTRIES is set so listed registries are pulled over
# plain HTTP; earlier publishes lack that constructor.
[dependencies.greentic-distributor-client]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
features = ["pack-fetch"]

# Floor pinned to the greentic-runner#698 publish that adds
# `RunOptions::entry_node`: the demo messaging host passes a card-nav target
# that names a flow node as the flow's entry node, so an earlier publish does
# not compile here.
[dependencies.greentic-runner-desktop]
version = ">=1.2.0-dev.32455370325, <1.3.0-0"

# Floor pinned to the greentic-runner#466 publish that fixes flow-node
# component-id resolution: `HostNode::from` no longer splits a resolved
# component symbol on its last dot when the operation is carried structurally
# (in `component.operation` or the input mapping), and `invoke_component`
# falls back to the legacy `<comp>.<op>` form only when the stripped suffix is
# the operation. Earlier publishes mis-resolve any dotted component id (e.g.
# `ai.greentic.component-templates` → `ai.greentic`) and fail flow execution
# with "component '…' not found in pack". This floor supersedes (and still
# satisfies) the C5 `runtime_refs` floor (#424).
#
# Floor raised again to 1.2.0-dev.29565371086: the first dev publish built
# against deploy-spec 0.2 (greentic-runner#599). runner-host's ids cross into
# revision_pull / doctor_env alongside the deployer's, so a resolve that picks an
# earlier dev publish — 1.2.0-dev.29558260044 and older declare deploy-spec
# ">=0.1.0-0, <0.2.0-0" — drags a second deploy-spec copy back in and
# reintroduces the E0308 above. An API floor, not a preference: don't lower it.
#
# Floor raised again to 1.2.0-dev.32267250441 (greentic-runner#698): that
# publish carries `FlowEngine::execute_from`, the ported `var.set` and card
# `answers` node families, and the one-shot routing action. Without it a
# designer card journey loses every captured field. An API floor: don't lower.
#
# Floor raised again to 1.2.0-dev.32351477106 (greentic-runner#700, #701): that
# publish re-enables the `agentic-worker` feature, which is what makes an MCP
# flow node actually dispatch — before it, `execute_mcp` was a stub returning
# Ok with an `{error: ...}` payload, so an MCP node reported success while
# doing nothing. It also grows `HostConfig` with `agents`/`graphs`, which
# `build_demo_host_config` now initialises; an earlier publish does not
# compile here. An API floor: don't lower it.
[dependencies.greentic-runner-host]
version = ">=1.2.0-dev.32455370325, <1.3.0-0"
# `greentic-llm-backend` routes every in-process `dw.agent` LLM call through
# greentic-llm's multi-provider backend. Without it runner-host compiles the
# OpenAI-only client (`agent_node.rs`, "built WITHOUT the greentic-llm-backend
# feature"): the agent's configured `llm.provider` is ignored, Ollama cannot call
# tools, and a keyless provider still needs a key. greentic-runner's own release
# binary has always been built with it; the operator environment, k8s and
# Cloud Run all serve through THIS binary instead, so they never had it.
#
# `desktop-agent-ephemeral` is deliberately NOT enabled. runner-host documents it
# as "must NOT be enabled in the server binary": it switches on greentic-aw-runtime's
# `test-mock` (a mock token meter) and `dev-allow-unsigned`, and this binary is
# also the greentic-start-distroless image pods run. So `dw.agent` here still
# needs `GREENTIC_AW_REDIS_URL` for its state store, exactly as before.
features = ["greentic-llm-backend"]

[dependencies.greentic-secrets-lib]
# `providers-vault` brings in the HashiCorp Vault KV backend used for runtime
# secret resolution under pod workload identity (Phase E). The Kubernetes-auth
# token exchange it relies on landed in greentic-secrets#94, first published in
# 1.1.0-dev.28218485692 (the floor below) — older publishes resolve a vault
# provider that only supports a static VAULT_TOKEN, not the pod-identity login.
version = ">=1.2.0-dev, <1.3.0-0"
features = ["providers-dev", "providers-vault"]

# Lower bound pinned to the publish that updates the bootstrap call site for
# the deployer's 2-arg `ensure_local_environment` (greentic-setup#134).
# Earlier publishes have the 1-arg call against the new deployer floor and
# would fail to compile in the resolved graph.
[dependencies.greentic-setup]
version = ">=1.2.0-dev, <1.3.0-0"

[dependencies.greentic-telemetry]
# Floor pinned to the first dev publish that exposes `RolloutEvent` +
# `emit_rollout_event` (C5.1); lower versions in the same range satisfy
# `>=1.1.0-dev` but lack the rollout module.
version = ">=1.2.0-dev, <1.3.0-0"

[dependencies.greentic-types]
version = ">=1.2.0-dev, <1.3.0-0"
features = ["serde"]

# Update-serving surface (revision_serve.rs): `binswap` carries the archive-unpack
# + atomic-swap primitive behind the stage-only binary self-update path
# (`select_binary`); `stream` carries the SSE client the push path uses
# (`stream::{build_stream_client, run_stream}`). Tracks greentic-update's dev
# line — the `0.1.x` cross-lane conflict that once blocked this (distributor-client
# 1.2) is gone now that greentic-update publishes `1.2.0-dev.N` on the same lane.
[dependencies.greentic-update]
version = ">=1.2.0-dev.30553549034, <1.3.0-0"
features = ["binswap", "stream"]

[dependencies.hyper]
version = "1"
features = ["full"]

[dependencies.qa-spec]
version = ">=1.2.0-dev, <1.3.0-0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "signal", "sync", "net", "macros"]

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.ureq]
version = "3"
features = ["json"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dev-dependencies]
criterion = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# Enable greentic-llm's scriptable test double (TestLlmProvider) for unit tests
# only — `test-mock` stays out of release builds.
# Must stay byte-identical to the [dependencies] pin above (see its comment):
# a differing requirement here resolves a second greentic-llm for test builds.
greentic-llm = { version = "=1.3.1-research.0", features = ["test-mock"] }
tokio = { version = "1", features = ["test-util"] }

# TEMPORARY -- resolve the runner crates from git while crates.io publishing is
# locked fleet-wide (403 authentication failed; the sole owning account is
# locked out). Without this, the engine compiled into this binary -- and into
# the greentic-start-distroless image that k8s and Cloud Run pods run -- is
# whatever was last published to crates.io on 2026-09-07, which predates
# greentic-runner#757 (the "now" flow-template namespace).
#
# The dependency REQUIREMENTS above are deliberately untouched: their floor is
# documented as an API floor and must not be lowered. greentic-runner#758
# raised that repo's develop placeholder above the floor instead, which is what
# lets this patch resolve at all -- a patch whose version sits below the
# requirement is silently IGNORED by cargo ("was not used in the crate graph")
# and the stale registry copy wins, with nothing reported anywhere.
#
# A patch section does not travel into a published crate (verified with
# cargo package), so this does not change what a crates.io consumer resolves.
#
# TO UNWIND once publishing is restored: delete this block and run
# cargo update -p greentic-runner-host -p greentic-runner-desktop
[patch.crates-io]
greentic-runner-host = { git = "https://github.com/greenticai/greentic-runner", rev = "83b2aaa526a649ea65d06b22ef1144d906ed2b68" }
greentic-runner-desktop = { git = "https://github.com/greenticai/greentic-runner", rev = "83b2aaa526a649ea65d06b22ef1144d906ed2b68" }
