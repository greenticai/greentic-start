bench = [
    { name = "perf", harness = false },
]

[package]
name = "greentic-start"
version = "1.2.0-dev.0"
edition = "2024"
rust-version = "1.95"
description = "Greentic lifecycle runner for start/restart/stop orchestration"
license = "MIT"
repository = "https://github.com/greenticai/greentic-start"
homepage = "https://github.com/greenticai/greentic-start"
readme = "README.md"
keywords = [
    "greentic",
    "cli",
    "lifecycle",
    "orchestration",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper-tungstenite = "0.20"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.46"
libc = "0.2"
once_cell = "1.21"
open = "5"
rand = "0.10"
rpassword = "7"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
rustls = "0.23"
rustls-pemfile = "2"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sys-locale = "0.3"
sysinfo = "0.39"
sha2 = "0.11"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
unic-langid = "0.9"
urlencoding = "2"
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime"] }
zip = "8"
zstd = "0.13"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[dependencies.greentic-distributor-client]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false
features = [
    "pack-fetch",
]

[dependencies.greentic-setup]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.axum]
version = "0.8"

# Pinned to runner research rev dd6924c8, which carries the admin-registry HTTP
# config provider (runner PR #385) PLUS the uniform-node-I/O routing fixes
# #483-#487 (outcome event injection, native on_complete/on_submit + on_cancel/
# on_timeout routing, numeric/contains condition operators) so deployed flows
# route end-to-end. This rev is on the wasmtime-45 line (see wasmtime dep above).
[dependencies.greentic-runner-desktop]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "ad08c976483c33e4af37876670a2696dbcd4cbc0"
default-features = false
features = ["agentic-worker"]

[dependencies.greentic-runner-host]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "ad08c976483c33e4af37876670a2696dbcd4cbc0"
default-features = false
features = ["agentic-worker"]

[dependencies.greentic-aw-runtime]
git = "https://github.com/greenticai/greentic-runner.git"
rev = "ad08c976483c33e4af37876670a2696dbcd4cbc0"
default-features = false

[dependencies.greentic-secrets-lib]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "providers-dev",
]

# Exact-pinned to the research-content build (carries ComponentDescribe.outcomes,
# PackManifest.agents, and runtime_dispatch types the runner rev needs). A loose
# `>=1.1.0-dev, <1.2.0-0` would resolve to a higher-numbered develop/main build
# that LACKS those, breaking the runner graph; consuming the published research
# build directly avoids the old git [patch] that force-unified greentic-types and
# broke greentic-setup. Bump this when a newer research build is published.
[dependencies.greentic-types]
version = "=1.1.0-dev.27836473437"
features = [
    "serde",
]

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.qa-spec]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "signal",
    "sync",
    "net",
]

[dependencies.tokio-stream]
version = "0.1"
features = [
    "sync",
]

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
    "serde",
]

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

# greentic-runner (rev ad08c976) pulls greentic-extension-sdk-contract
# =1.2.11-research and greentic-mcp-exec (list_tools), both git-tag/branch-only
# (not republished to crates.io). Cargo [patch] does NOT propagate through git
# dependencies, so greentic-start must declare the same redirects to resolve the
# agentic-worker graph. NOTE: unlike the runner, we do NOT patch greentic-types
# here (we pin the published research build above) — a git patch would unify
# greentic-types graph-wide and break greentic-setup's 0.5 line.
[patch.crates-io]
greentic-extension-sdk-contract = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.2.11-research" }
greentic-mcp-exec = { git = "https://github.com/greenticai/greentic-mcp.git", rev = "450df805c395624041951f217c833884beb81440" }
